name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write      # required for gh-deploy
  pages: write         # for GitHub Pages
  id-token: write      # for provenance
  actions: read

jobs:
  build-deploy:
    name: MkDocs Build and Deploy
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. Checkout repository
      # ============================================================
      - name: Checkout source
        uses: actions/checkout@v4

      # ============================================================
      # 2. Set up Python
      # ============================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ============================================================
      # 3. Cache pip dependencies
      # ============================================================
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/mkdocs-requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # ============================================================
      # 4. Install MkDocs and dependencies
      # ============================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r mkdocs-requirements.txt

      # ============================================================
      # 5. Install pip-audit and run dependency scan
      # ============================================================
      - name: Security audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit --strict

      # ============================================================
      # 6. Validate MkDocs configuration and build site
      # ============================================================
      - name: Build MkDocs site
        run: mkdocs build --clean --strict

      # ============================================================
      # 7. Ensure .nojekyll for GitHub Pages
      # ============================================================
      - name: Add .nojekyll
        run: touch site/.nojekyll

      # ============================================================
      # 8. Deploy to GitHub Pages
      # ============================================================
      - name: Deploy to GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mkdocs gh-deploy --force --clean

      # ============================================================
      # 9. Upload build artifact (optional for debugging)
      # ============================================================
      - name: Upload site artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: built-site
          path: site/
