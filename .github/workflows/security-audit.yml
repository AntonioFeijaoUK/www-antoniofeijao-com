name: Monthly Dependency Audit

on:
  schedule:
    - cron: "0 8 1 * *"  # Run at 08:00 UTC on the 1st of every month
  workflow_dispatch:      # Allow manual trigger

permissions:
  contents: read
  security-events: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Run dependency audit
        run: pip-audit -r mkdocs-requirements.txt -f json -o audit-results.json
      - name: Upload audit results
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-report
          path: audit-results.json
      - name: Print summary
        run: cat audit-results.json | jq '.vulnerabilities[] | {name, version, id, fix_version}'
