title: "Antonio Feijao | Cyber Security Architect, AWS & Linux"

description: "Hands-on cybersecurity notes, AWS cloud security architecture, Linux and networking tutorials, incident response insights, and Bitcoin/cryptography learning."

url: "https://www.antoniofeijao.com"
baseurl: ""
locale: en_GB
timezone: Europe/London

author: "Antonio Feijao UK"

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

highlighter: rouge

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

collections:
  pages:
    output: true
    permalink: /:name/
  cyber:
    output: true
    permalink: /cyber/:path/
  crypto:
    output: true
    permalink: /crypto/:path/
  timeline:
    output: true
    permalink: /timeline/:path/

permalink: /blog/:year/:month/:day/:title/

defaults:
  - scope:
      path: ""
    values:
      layout: default
      toc: true
      toc_sticky: true

  - scope:
      path: ""
      type: "posts"
    values:
      layout: default

  - scope:
      path: ""
      type: "pages"
    values:
      layout: default

  - scope:
      path: ""
      type: "cyber"
    values:
      layout: default
      section: cyber

  - scope:
      path: ""
      type: "crypto"
    values:
      layout: default
      section: crypto

  - scope:
      path: ""
      type: "timeline"
    values:
      layout: timeline-event
      section: timeline

twitter:
  card: summary_large_image

include:
  - .well-known

exclude:
  - README.md
  - LICENSE
  - .DS_Store
  - "**/.DS_Store"
  - vendor
  - node_modules
  - Gemfile
  - Gemfile.lock
  - _timeline/script.js
  - _timeline/styles.css
  - _timeline/events.json
  - _timeline/css
  - _timeline/js
  - _timeline/events
  - _timeline/events-backup-01
  
sass:
  style: compressed

liquid:
  error_mode: warn
  strict_filters: false
  strict_variables: false
