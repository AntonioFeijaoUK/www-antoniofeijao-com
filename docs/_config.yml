title: "Antonio Feijao | Cyber Security Architect, AWS & Linux"

description: "Hands-on cybersecurity notes, AWS cloud security architecture, Linux and networking tutorials, incident response insights, and Bitcoin/cryptography learning."

url: "https://www.antoniofeijao.com"
baseurl: ""
locale: en_GB
timezone: Europe/London

author: "Antonio Feijao UK"

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

highlighter: rouge

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

collections:
  pages:
    output: true
    permalink: /:name/
  cyber:
    output: true
    permalink: /cyber/:path/
  crypto:
    output: true
    permalink: /crypto/:path/
  timeline:
    output: false

permalink: /blog/:year/:month/:day/:title/

defaults:
  - scope:
      path: ""
    values:
      layout: default

  - scope:
      path: ""
      type: "posts"
    values:
      layout: default

  - scope:
      path: ""
      type: "pages"
    values:
      layout: default

  - scope:
      path: ""
      type: "cyber"
    values:
      layout: default
      section: cyber

  - scope:
      path: ""
      type: "crypto"
    values:
      layout: default
      section: crypto

twitter:
  card: summary_large_image

include:
  - .well-known

exclude:
  - README.md
  - LICENSE
  - .DS_Store
  - "**/.DS_Store"
  - vendor
  - node_modules
  - Gemfile
  - Gemfile.lock
  
sass:
  style: compressed

liquid:
  error_mode: warn
  strict_filters: false
  strict_variables: false

