<nav class="site-nav">
  <div class="site-nav-links">
    {% for item in site.data.navigation.main %}
      <a href="{{ item.url | relative_url }}">{{ item.title }}</a>
    {% endfor %}
  </div>

  <form class="site-nav-search" action="{{ '/search/' | relative_url }}" method="get" role="search">
    <label class="visually-hidden" for="nav-search-input">Search website</label>
    <input id="nav-search-input" type="search" name="q" placeholder="Type to search...">
  </form>
</nav>
