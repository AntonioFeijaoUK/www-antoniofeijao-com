<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    {% seo %}

    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    {% if page.utility_stylesheet %}
      <link rel="stylesheet" href="{{ page.utility_stylesheet | relative_url }}">
    {% endif %}
  </head>

  <body>
    <div id="header_wrap" class="outer">
      <header class="inner">
        {% include site-header.html %}
        {% include nav.html %}
      </header>
    </div>

    <div id="main_content_wrap" class="outer">
      <main
        id="main_content"
        class="inner {{ page.main_class }}"
        aria-label="Main content"
      >
        {% if page.title %}
          <h1>{{ page.title }}</h1>
        {% endif %}

        {{ content }}
      </main>
    </div>

    {% include footer.html %}
    <script src="{{ '/assets/script-files/site-nav-search.js' | relative_url }}" defer></script>
    {% if page.utility_script %}
      <script src="{{ page.utility_script | relative_url }}" defer></script>
    {% endif %}
  </body>
</html>
