# ============================================================
# Project Information v2025.10.10.1215
# ============================================================
site_name: "Antonio Feijao UK – Cyber Security Architect Learning by Doing"
site_url: https://www.antoniofeijao.com/
site_author: "Antonio Feijao UK"
site_description: >
  Insights and projects by Antonio Feijao, UK Security Architect at Genomics England.
  Expertise in AWS, Networking, Security, Infrastructure, Linux, macOS, and Python 3.

repo_url: https://github.com/AntonioFeijaoUK/antoniofeijao.com
repo_name: AntonioFeijaoUK/antoniofeijao.com
# edit_uri: edit/main/docs/

# ============================================================
# Copyright
# ============================================================
copyright: >
  Copyright &copy; 2025
  <a href="https://www.antoniofeijao.com/">Antonio Feijao UK</a>.
  All rights reserved.

# ============================================================
# Theme Configuration
# ============================================================
theme:
  name: material
  favicon: assets/images/favicon.ico
  logo: assets/images/Antonio-Feijao-UK.jpeg
  language: en
  font: false               # using custom fonts/CSS; set true to use Material defaults
  navigation_depth: 4
  highlightjs: true
  hljs_languages:
    - yaml
    - python
    - bash

  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - content.code.annotate
    - toc.follow

  palette:
    - scheme: default
      primary: deep orange
      accent: orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

  shortcuts:
    help: 72
    next: 78
    previous: 80
    search: 83

# ============================================================
# Extra Metadata and Social Links (theme-level)
# ============================================================
extra:
  generator: false
  social:
    - icon: fontawesome/solid/house
      link: https://www.antoniofeijao.com/
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/antoniofeijaouk
    - icon: fontawesome/brands/github
      link: https://github.com/AntonioFeijaoUK

# ============================================================
# Navigation Structure (no globs, strict-mode compatible)
# ============================================================
#nav:
#  - Home: index.md
#  - Blog:
#      - Index: blog/index.md
#  - News: news/index.md
#  - Projects: pages/index.md
#  - About: about-me/index.md
#  - Contact: contact.md

# ============================================================
# Plugins (core + minimal)
# ============================================================
plugins:
  - search

# ============================================================
# Markdown Extensions (unchanged)
# ============================================================
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      preserve_tabs: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.snippets
  - pymdownx.magiclink

# ============================================================
# Build Configuration
# ============================================================
site_dir: site
use_directory_urls: true
strict: true
