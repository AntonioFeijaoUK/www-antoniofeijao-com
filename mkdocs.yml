# ============================================================
# Project Information v2025.10.10.1215
# ============================================================
site_name: "Antonio Feijao UK – Cyber Security Architect Learning by Doing"
site_url: https://www.antoniofeijao.com/
site_author: "Antonio Feijao UK"
site_description: >
  Insights and projects by Antonio Feijao, UK Security Architect at Genomics England.
  Expertise in AWS, Networking, Security, Infrastructure, Linux, macOS, and Python 3.

repo_url: https://github.com/AntonioFeijaoUK/
repo_name: AntonioFeijaoUK/
# edit_uri: edit/main/docs/

include:
  - ".well-known"

# ============================================================
# Copyright
# ============================================================
copyright: >
  Copyright &copy;
  <a href="https://www.antoniofeijao.com/">Antonio Feijao UK</a>.
  All rights reserved.

# ============================================================
# Theme Configuration
# ============================================================
theme:
  name: material
  favicon: assets/images/favicon.ico
  logo: assets/images/Antonio-Feijao-UK.jpeg
  language: en
  font: false               # using custom fonts/CSS; set true to use Material defaults
  navigation_depth: 4
  highlightjs: true
  hljs_languages:
    - yaml
    - python
    - bash

  features:
    - content.code.copy
    - content.tabs.link
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - content.code.annotate
    - search.highlight
    - search.share
    - toc.follow
    - toc.integrate
    
  palette:
    - scheme: slate            # Dark mode default
      primary: black            # Dark header bar
      accent: deep orange       # Accent highlights
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default           # Light mode
      primary: deep orange      # Orange header in light mode
      accent: orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    
  shortcuts:
    help: 72
    next: 78
    previous: 80
    search: 83

# ============================================================
# Extra Metadata and Social Links (theme-level)
# ============================================================
extra:
  generator: false
  extra_css:
    - assets/extra.css
  social:
    - icon: fontawesome/solid/house
      link: https://www.antoniofeijao.com/
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/antoniofeijaouk
    - icon: fontawesome/brands/github
      link: https://github.com/AntonioFeijaoUK

# ============================================================
# Navigation Structure (no globs, strict-mode compatible)
# ============================================================
#nav:
#  - Home: index.md
#  - Blog:
#      - Index: blog/index.md
#  - News: news/index.md
#  - Projects: pages/index.md
#  - About: about-me/index.md
#  - Contact: contact.md

# ============================================================
# Plugins (core + minimal)
# ============================================================
plugins:
  - privacy  # Plugin for privacy compliance.
  # - mkdocstrings  # Uncomment if documentation string extraction is required.
  #- glob  # Plugin to enable glob patterns in the navigation.
  - social:
      enabled: true  # Enable social plugin.
  - blog:
      enabled: true
      blog_dir: .
      post_date_format: full
      post_url_format: "{categories}/{slug}"
      post_url_max_categories: 3
      post_excerpt: optional
      excerpt_separator: <!-- more -->
      post_excerpt_separator: <!-- more -->
  - search:
      enabled: true
      lang: en
  #- macros:
  #    enabled: true
  - git-revision-date-localized:
      enabled: true
      enable_creation_date: true
      type: iso_datetime
      fallback_to_build_date: true
  - tags:
      enabled: true
  #- pagetree: # Plugin to auto-generate the page tre

# ============================================================
# Markdown Extensions (unchanged)
# ============================================================
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      preserve_tabs: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.snippets
  - pymdownx.magiclink

# ============================================================
# Build Configuration
